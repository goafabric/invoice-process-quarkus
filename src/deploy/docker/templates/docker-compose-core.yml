services:
  core-service-application:
    container_name: core-service-application
    image:  goafabric/core-service-quarkus:1.0.1
    restart: 'no'
    command: ["-Xmx${_Values_resources_requests_memory}"]
    ports:
      - "50800:8080"

    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      disable: true
      interval: 5s
      timeout: 10s
      retries: 5

    volumes:
#      - tmp_core:/tmp
      - applogs_core:/usr/share/logs
    networks:
      - ${_Values_root_name}-net
    environment:
      #application
      TZ: Europe/Berlin
      quarkus.http.port: "8080"
      quarkus.http.io-threads: "20"

      #tracing
      quarkus.otel.exporter.otlp.traces.endpoint: "http://${_Values_host_docker_internal}:4317"
      quarkus.application.name: "core-service"

      #start
      process.autostart: false

      #persistence
      quarkus.datasource.jdbc.url: "jdbc:postgresql://${_Values_host_docker_internal}:50810/core"
      quarkus.datasource.jdbc.max-size: "10"

      database.provisioning.goals: "-migrate -import-demo-data"

      #secrets
      quarkus.datasource.username: "core-service"
      quarkus.datasource.password: "core-service"

      #log levels
      logging.level.root: "WARN"
      logging.level.org.goafabric: "INFO"
      logging.level.org.springframework: "INFO"

    depends_on:
      postgres:
        condition: service_started