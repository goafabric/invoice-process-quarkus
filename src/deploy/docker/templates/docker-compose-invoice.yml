services:
  invoice-process-application:
    container_name: invoice-process-application
    image:  goafabric/invoice-process-quarkus:1.0.1-SNAPSHOT
    restart: 'no'
    command: "-Xmx32m"
    ports:
      - "50400:8080"

    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      disable: true #disabled for native images because of no curl
      interval: 5s
      timeout: 10s
      retries: 5

    volumes:
      - tmp_invoice:/tmp
      - applogs_invoice:/usr/share/logs
    networks:
      - ${_Values_root_name}-net
    environment:
      #application
      TZ: Europe/Berlin
      quarkus.http.port: "8080"
      quarkus.http.io-threads: "20"

      #tracing
      quarkus.otel.exporter.otlp.traces.endpoint: "http://${_Values_host_docker_internal}:4317"
      quarkus.application.name: "catalog-service"

      #start
      process.autostart: false

      #adapter
      adapter.coreservice.url: "http://${_Values_host_docker_internal}:50800"
      adapter.catalogservice.url: "http://${_Values_host_docker_internal}:50600"


      #azure blob
      azure.storage.blob.container-name: "invoice"
      quarkus.azure.storage.blob.connection-string: DefaultEndpointsProtocol=http;AccountName=$${azure.storage.blob.account-name};AccountKey=$${azure.storage.blob.account-key};BlobEndpoint=http://${_Values_host_docker_internal}:10000/$${azure.storage.blob.account-name}

      azure.storage.blob.account-name: devstoreaccount1
      azure.storage.blob.account-key: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==

      #log levels
      logging.level.root: "WARN"
      logging.level.org.goafabric: "INFO"
      logging.level.org.springframework: "INFO"